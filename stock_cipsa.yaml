services:
  - type: web
    name: g360-stock-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Las URLs de la fuente de datos deben configurarse en el Dashboard de Render
      # como variables de entorno S1_SOURCE1_URL y S1_SOURCE2_URL
      - key: S1_SOURCE1_URL
        value: "https://your-erp-host:port/path/to/report"
      - key: S1_SOURCE2_URL
        value: "https://your-erp-host:port/path/to/report?parametro=1"
      - key: S1_CACHE_TTL_SEGUNDOS
        value: "600"
      - key: S1_CACHE_RUTA
        value: "data/stock_cache.json"
      - key: S1_CACHE_RUTA2
        value: "data/stock_cache_sucursales.json"
      - key: S1_CATALOGO_RUTA
        value: "data/catalog_cache.json"
      - key: S1_CATALOGO_TTL_SEGUNDOS
        value: "21600"
    healthCheckPath: /api/v1/health
