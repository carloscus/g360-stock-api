services:
  - type: web
    name: g360-stock-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Las URLs de la fuente de datos deben configurarse en el Dashboard de Render
      # como variables de entorno S1_SOURCE1_URL y S1_SOURCE2_URL
      - key: S1_SOURCE1_URL
        value: "https://your-erp-host:port/path/to/report"
      - key: S1_SOURCE2_URL
        value: "https://your-erp-host:port/path/to/report?parametro=1"
      - key: S1_CACHE_TTL_SEGUNDOS
        value: "600"
      - key: S1_CACHE_RUTA
        value: "data/stock_cache.json"
      - key: S1_CACHE_RUTA2
        value: "data/stock_cache_sucursales.json"
      - key: S1_CATALOGO_RUTA
        value: "data/catalog_cache.json"
      - key: S1_CATALOGO_TTL_SEGUNDOS
        value: "21600"
    healthCheckPath: /api/v1/health

# Cron para mantener el dyno activo y evitar el cold start por sleep.
# Render duerme el dyno tras 15 min de inactividad; pinguear cada 14 min
# mantiene el servicio caliente. Es gratis en el plan free.
crons:
  - name: stock-ping
    schedule: "*/14 * * * *"
    command: curl -sf https://g360-stock-api.onrender.com/api/v1/health
